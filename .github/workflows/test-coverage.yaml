# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Calcula la cobertura de los tests y la muestra en el resumen de la Action
# (no necesita cuenta en Codecov).
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          print(cov)

          cat("\nLineas sin testear:\n")
          lineas <- as.data.frame(cov)
          sin_testear <- lineas[lineas$value == 0, c("filename", "first_line")]
          if (nrow(sin_testear) == 0) cat("Ninguna\n") else print(sin_testear)

          por_archivo <- covr::coverage_to_list(cov)
          resumen <- c(
            "## Cobertura de tests",
            "",
            sprintf("**Total: %.1f%%**", por_archivo$totalcoverage),
            "",
            "| Archivo | Cobertura |",
            "|---|---|",
            sprintf("| %s | %.1f%% |", names(por_archivo$filecoverage), por_archivo$filecoverage)
          )
          writeLines(resumen, Sys.getenv("GITHUB_STEP_SUMMARY"))

          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
